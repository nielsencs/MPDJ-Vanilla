apply plugin: 'com.android.application'

Properties signingProperties = new Properties()
File signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { name ->
    signingProperties.getProperty(name) ?: System.getenv(name)
}

def hasReleaseSigning = ['MPDJ_RELEASE_STORE_FILE', 'MPDJ_RELEASE_STORE_PASSWORD', 'MPDJ_RELEASE_KEY_ALIAS', 'MPDJ_RELEASE_KEY_PASSWORD'].every { signingValue(it) }

android {
    namespace 'ch.blinkenlights.android.vanilla'

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }

    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "uk.co.biblestudyman.mpdj.vanilla"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "0.1.10"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            releaseSigning {
                storeFile file(signingValue('MPDJ_RELEASE_STORE_FILE'))
                storePassword signingValue('MPDJ_RELEASE_STORE_PASSWORD')
                keyAlias signingValue('MPDJ_RELEASE_KEY_ALIAS')
                keyPassword signingValue('MPDJ_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            zipAlignEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.releaseSigning
            }
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'junit:junit:4.12'
    compileOnly 'androidx.annotation:annotation:1.0.0'
}
